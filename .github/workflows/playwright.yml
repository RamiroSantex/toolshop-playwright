name: Playwright Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Suite de regresion (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador
        run: npx playwright install --with-deps chromium

      - name: Correr la suite
        run: npx playwright test --trace=on-first-retry
        env:
          CI: true

      # Si algo falla se guarda el reporte HTML (y trazas/capturas en test-results)
      - name: Subir reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
