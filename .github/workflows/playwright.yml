name: Playwright Tests

on:
  pull_request:
  workflow_dispatch:

# La demo publica (practicesoftwaretesting.com) muestra un desafio anti-bot de
# Cloudflare a los runners de GitHub, asi que el CI levanta Toolshop propio con
# Docker (proyecto oficial testsmith-io/practice-software-testing, sprint5)
# y corre la suite contra localhost. En local el default sigue siendo la demo publica.
env:
  SPRINT: sprint5
  DISABLE_LOGGING: "true"
  PST_REF: main

jobs:
  test:
    name: Suite de regresion (chromium)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      BASE_URL: http://localhost:4200
      API_URL: http://localhost:8091
    steps:
      - uses: actions/checkout@v4

      - name: Clonar Toolshop oficial
        run: git clone --depth 1 --branch "$PST_REF" https://github.com/testsmith-io/practice-software-testing.git "$RUNNER_TEMP/pst"

      - name: Levantar contenedores de Toolshop
        working-directory: ${{ runner.temp }}/pst
        run: docker compose -f docker-compose.yml up -d --force-recreate

      - name: Instalar dependencias PHP (composer)
        working-directory: ${{ runner.temp }}/pst
        run: |
          sleep 20
          docker compose exec -T -u root laravel-api composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-ffi
          # storage/ debe ser escribible por php-fpm (sino /brands, /products... responden 500 por tempnam())
          docker compose exec -T -u root laravel-api sh -c "chown -R www-data /var/www && chmod -R 777 /var/www/storage /var/www/bootstrap/cache"

      - name: Esperar a MariaDB
        working-directory: ${{ runner.temp }}/pst
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T mariadb mysqladmin ping -h localhost -u root -proot --silent 2>/dev/null; then
              echo "MariaDB lista"; exit 0
            fi
            echo "Intento $i/30, esperando 2s..."; sleep 2
          done
          echo "MariaDB no levanto"; exit 1

      - name: Migrar y sembrar la base
        working-directory: ${{ runner.temp }}/pst
        run: docker compose exec -T laravel-api php artisan migrate:refresh --seed

      - name: Healthcheck de la API
        run: |
          curl -fsS http://localhost:8091/status
          curl -sS http://localhost:8091/brands | head -c 1500 || true
          echo
          curl -fsS -X POST http://localhost:8091/users/login \
            -H 'Content-Type: application/json' \
            --data-raw '{"email":"customer@practicesoftwaretesting.com","password":"welcome01"}' | head -c 120

      - name: Esperar a la UI Angular
        working-directory: ${{ runner.temp }}/pst
        run: |
          for i in $(seq 1 90); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4200)" = "200" ]; then
              echo "UI lista"; exit 0
            fi
            echo "Intento $i/90, esperando 5s..."; sleep 5
          done
          docker compose logs angular-ui | tail -50
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador
        run: npx playwright install --with-deps chromium

      - name: Correr la suite
        run: npx playwright test --trace=on-first-retry
        env:
          CI: true

      # Si algo falla se guarda el reporte HTML (y trazas/capturas en test-results)
      - name: Subir reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Logs de contenedores (si falla)
        if: failure()
        working-directory: ${{ runner.temp }}/pst
        run: docker compose logs --tail=80
